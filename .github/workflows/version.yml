name: Update Version

on:
  push:
    branches:
      - main

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "export const version = '1.$COUNT';" > src/app/version.ts
