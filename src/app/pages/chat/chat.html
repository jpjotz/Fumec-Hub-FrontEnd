<div class="chat-container">
  <app-chat-list [user]="user()" [style.display]="selectedChat() ? 'none' : 'block' " (openChatSelected)="selectedChat.set($event)"></app-chat-list>

  @if (selectedChat()) {
    <app-chat-window [chat]="selectedChat()" [user]="user()" (back)="selectedChat.set(null)"></app-chat-window>
  }
</div>
