<div class="flex h-dvh w-full overflow-hidden">
  <app-chat-list
    [user]="user()"
    [class.hidden]="selectedChat() !== null"
    class="h-full w-full shrink-0 overflow-y-auto md:!block md:w-[350px]"
    (openChatSelected)="openChat($event)"
  ></app-chat-list>

  @if (selectedChat()) {
    <app-chat-window
      [chat]="selectedChat()"
      [user]="user()"
      class="h-full w-full min-w-0 flex-1"
      (back)="goBack()"
    ></app-chat-window>
  }
</div>
