<div class="flex h-dvh w-full overflow-hidden">
  <app-chat-list
    [user]="user()"
    [class.hidden]="selectedChat() !== null"
    class="h-full w-full shrink-0 overflow-y-auto md:!block md:w-[350px]"
    (openChatSelected)="openChat($event)"
  ></app-chat-list>

  @if (selectedChat()) {
    <app-chat-window
      [chat]="selectedChat()"
      [user]="user()"
      class="h-full w-full min-w-0 flex-1"
      (back)="goBack()"
    ></app-chat-window>
  } @else {
    <div class="hidden flex-1 items-center justify-center bg-gray-50 md:flex">
      <div class="text-center">
        <span class="material-symbols-outlined mb-2 text-5xl text-gray-300">
          chat
        </span>
        <p class="text-lg font-medium text-gray-500">
          Entre em uma conversa
        </p>
        <p class="text-sm text-gray-400">
          Selecione um contato para começar a conversar.
        </p>
      </div>
    </div>
  }
</div>
