<h1>Login</h1>

<input [(ngModel)]="email" type="text" placeholder="Digite seu email">
<br>
<input [(ngModel)]="password" type="password" placeholder="Digite sua senha" (keyup.enter)="login()">

<br>
<br>

<button (click)="login()" [disabled]="loading()">Login</button>

@if (loading()) {
  <p>Efetuando Login...</p>
}

&nbsp;
<button (click)="goToRegister.emit()">Criar uma conta</button>

@if (message()) {
  <p style="color: red;">{{ message() }}</p>
}
