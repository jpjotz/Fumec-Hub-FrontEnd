@if (requests().length === 0) {
  <p>Nenhuma solicitação encontrada</p>
}

@for (request of requests(); track request.id) {
  <div
    class="mb-[15px] flex justify-between gap-[15px] rounded-[10px] border border-[rgb(208,208,208)] p-[15px]"
  >
    <div class="flex flex-col gap-[5px]">
      <p class="m-0">
        <b>{{ request.sender.name }}</b>
      </p>

      <span class="text-[gray]">
        <b>ID:</b> {{ request.sender.friendCode }}
      </span>
    </div>

    <div class="flex flex-row justify-end gap-2.5">
      <button
        class="flex cursor-pointer justify-center rounded-[5px] border-0 bg-[rgb(127,253,127)] p-2.5 text-[green]"
        (click)="aceitar(request.id)"
      >
        <span class="material-symbols-outlined">check</span>
      </button>

      <button
        class="flex cursor-pointer justify-center rounded-[5px] border-0 bg-[rgb(255,188,188)] p-2.5 text-[red]"
        (click)="rejeitar(request.id)"
      >
        <span class="material-symbols-outlined">close_small</span>
      </button>
    </div>
  </div>
}
