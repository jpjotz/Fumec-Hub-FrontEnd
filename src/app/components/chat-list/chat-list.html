<h1>Olá, {{user()?.name}}</h1>

<button (click)="logout()">Desconectar</button>

<h2>Seus Amigos:</h2>

@if(chats.length === 0) {
  <p>Tu nao tem amigo, amigao</p>
  <img src="davy.jpg" alt="">
  <img src="javascripto.jpeg" alt="">
}

@for (chat of chats(); track chat.id) {
  <app-chat-item [chat]="chat"></app-chat-item>
}
