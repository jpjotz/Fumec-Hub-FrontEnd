<div
  class="fixed inset-0 z-[9999] flex items-center justify-center bg-[rgba(0,0,0,0.5)] p-4 select-none"
>
  <div class="relative flex flex-col rounded-[10px] bg-white p-5">
    <header class="mb-[15px] flex flex-row items-center justify-between py-2.5 border-b border-gray-300">
      <div class="flex flex-col">
        <h2 class="m-0 text-[1.5em] font-bold">{{ titulo() }}</h2>
        <span class="text-sm text-gray-500">{{ subtitulo() }}</span>
      </div>

      <button
        class="absolute right-4 top-6 cursor-pointer border-0 bg-transparent text-[16px] font-bold select-none"
        (click)="close.emit()"
      >
        <span class="material-symbols-outlined">close</span>
      </button>
    </header>

    <ng-content></ng-content>
  </div>
</div>
